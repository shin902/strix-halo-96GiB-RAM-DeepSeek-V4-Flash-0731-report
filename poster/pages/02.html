<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>そもそも、96GBに入るのか？</title>
<style>
@page{size:A3 landscape;margin:0}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#202020;background:#f4f4f4}
.page{width:420mm;height:297mm;padding:20mm 41mm 25mm 22mm;background:#fff;position:relative;overflow:hidden}
.eyebrow{font-size:14pt;font-weight:700;letter-spacing:.16em;color:#555}
h1{font-size:49pt;line-height:1.25;letter-spacing:-.04em;margin:9mm 0 7mm}
.lead{font-size:25pt;line-height:1.48;margin:0 0 13mm;font-weight:650}
.lead strong{border-bottom:2.5mm solid #222}
.equation{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:stretch;gap:5mm;margin:0 0 13mm}
.term{border:1.1mm solid #222;min-height:62mm;padding:7mm 6mm;display:flex;flex-direction:column;justify-content:space-between}
.term.dark{background:#222;color:white}
.term small{font-size:13pt;font-weight:700;letter-spacing:.07em}
.term b{font-size:29pt;line-height:1.22;letter-spacing:-.03em}
.symbol{align-self:center;font-size:31pt;font-weight:400}
.takeaway{border-top:.6mm solid #222;padding-top:8mm;display:grid;grid-template-columns:75mm 1fr;gap:9mm}
.takeaway h2{font-size:19pt;margin:0;line-height:1.4}
.takeaway p{font-size:20pt;line-height:1.65;margin:0}
.next{font-size:16pt;font-weight:700;margin:10mm 0 0}
footer{position:absolute;bottom:12mm;left:22mm;right:42mm;border-top:.3mm solid #999;padding-top:4mm;display:flex;justify-content:space-between;font-size:11pt;color:#666}
@media print{body{background:#fff}.page{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style>
</head>
<body>
<section class="page">
  <div class="eyebrow">SECTION 02 / 最初の壁</div>
  <h1>そもそも、96GBに入るのか？</h1>
  <p class="lead">全体で96GBあるメモリを、<strong>丸ごとモデルには使えない。</strong></p>
  <div class="equation" aria-label="モデルの重み、OSと実行環境、会話の記憶領域を足した量が、実際に使えるメモリ以下である必要がある">
    <div class="term dark"><small>01 / モデル本体</small><b>重み</b></div>
    <span class="symbol">＋</span>
    <div class="term"><small>02 / 動かすため</small><b>OS・実行環境</b></div>
    <span class="symbol">＋</span>
    <div class="term"><small>03 / 長く話すため</small><b>KVキャッシュ</b></div>
  </div>
  <div class="takeaway">
    <h2>「起動できる」と<br>「常用できる」は違う</h2>
    <p>モデルが読み込めても、長い入力や生成に使うメモリが残らなければ、実用には厳しい。まず重みを圧縮し、会話のための余白を作る必要があった。</p>
  </div>
  <p class="next">次へ → DwarfStarで、まずは96GBに押し込む</p>
  <footer><span>Strix Halo × DeepSeek V4 Flash</span><span>02 / 08</span></footer>
</section>
</body>
</html>
